const beep = (freq=800, dur=0.12, type="sine", vol=0.15) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol; o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur);
  } catch(e){}
};
const happySound = () => { beep(660,0.1); setTimeout(()=>beep(880,0.12),120); setTimeout(()=>beep(1100,0.16),250); };
const sadSound   = () => { beep(330,0.15,"triangle"); setTimeout(()=>beep(220,0.2,"triangle"),160); };
const popSound   = () => beep(1000,0.08,"square",0.1);

const pickKoreanVoice = () => {
  const all = window.speechSynthesis?.getVoices() || [];
  const kor = all.filter(v => /ko/i.test(v.lang));
  return (
    kor.find(v => /Google/i.test(v.name)) ||
    kor.find(v => /Wavenet|Neural/i.test(v.name)) ||
    kor.find(v => /female|여/i.test(v.name)) ||
    kor[0]
  );
};
const speak = (text, speakerOn=true, opts={}) => {
  if (!speakerOn && !opts.force) return;
  try {
    window.speechSynthesis?.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    u.rate = opts.rate ?? 0.95;
    u.pitch = opts.pitch ?? 1.05;
    u.volume = 1.0;
    const v = pickKoreanVoice();
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch(e){}
};

const saveToGAS = (action, payload) => {
  if (!GAS_URL) return Promise.resolve({ok:false, reason:"no GAS_URL"});
  return fetch(GAS_URL, {
    method:"POST",
    body: JSON.stringify({ action, payload }),
    headers:{"Content-Type":"text/plain;charset=utf-8"}
  }).then(r=>r.json()).catch(e=>({ok:false, error:String(e)}));
};

/* =========================================================
   파티클 폭죽
========================================================= */
function Burst({ x, y, onDone }) {
  const colors = ["#FF6B9D","#FFD93D","#6BCB77","#54A0FF","#C56CF0","#FF9F43"];
  const particles = Array.from({length: 18}, (_,i)=> {
    const a = (Math.PI * 2 * i) / 18;
    const d = 80 + Math.random()*60;
    return { bx: Math.cos(a)*d, by: Math.sin(a)*d, c: colors[i % colors.length] };
  });
  useEffect(() => { const t = setTimeout(onDone, 1000); return ()=>clearTimeout(t); }, []);
  return (
    <div className="fixed pointer-events-none z-50" style={{ left:x, top:y }}>
      {particles.map((p,i)=>(
        <span key={i} className="burst-particle"
          style={{ "--bx":`${p.bx}px`, "--by":`${p.by}px`, background:p.c, width:14, height:14, borderRadius:"50%", display:"block" }} />
      ))}
    </div>
  );
}

function Quiz({ area, name, speakerOn, micOn, onDone, helpUsed, setHelpUsed }) {
  const pool = useMemo(()=> {
    const list = area === "int" ? QUESTIONS : QUESTIONS.filter(q=>q.area===area);
    return list.length ? list : QUESTIONS;
  }, [area]);

  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(0);
  const [bursts, setBursts] = useState([]);
  const [showHelp, setShowHelp] = useState(false);
  const q = pool[idx];
  const areaInfo = AREAS.find(a=>a.id === q.area) || AREAS[0];

  useEffect(()=>{ speak(q.q, speakerOn); }, [idx]);

  const choose = (i, evt) => {
    if (revealed) return;
    setPicked(i);
    setRevealed(true);
    const correct = i === q.ans;
    if (correct) {
      setScore(s=>s+1);
      happySound();
      const r = evt.currentTarget.getBoundingClientRect();
      const id = Date.now();
      setBursts(b=>[...b, {id, x:r.left+r.width/2, y:r.top+r.height/2}]);
      speak("정답이에요! 잘했어요!", speakerOn);
    } else {
      sadSound();
      speak("앗, 다시 생각해 볼까요? " + q.tip, speakerOn);
    }
  };

  const next = () => {
    setPicked(null); setRevealed(false);
    if (idx + 1 >= pool.length) {
      onDone({ total: pool.length, score: score + (picked===q.ans?0:0), helpUsed });
    } else {
      setIdx(i=>i+1);
    }
  };

  const askHelp = () => {
    setHelpUsed(h=> h+1);
    setShowHelp(true);
    speak(q.tip, true, { force: true });
    saveToGAS("help", { name, area: q.area, q: q.q, time: new Date().toISOString() });
  };

  return (
    <div className="absolute inset-0 pt-20 px-6 pb-6 overflow-hidden">
      <FloatingDeco/>
      {/* 영역 뱃지 */}
      <div className="flex items-center justify-between mb-3">
        <div className={`px-4 py-2 rounded-full font-cafe24 text-white bg-gradient-to-r ${areaInfo.color} shadow`}>
          {areaInfo.emoji} {areaInfo.name}
        </div>
        <div className="font-cafe24 text-xl text-gray-600">
          {idx+1} / {pool.length} 문제 · ⭐ {score}
        </div>
      </div>

      {/* 큰 키워드 이미지 */}
      <div className="flex justify-center mb-3">
        <motion.div key={idx}
          initial={{scale:0.4, rotate:-15, opacity:0}}
          animate={{scale:1, rotate:0, opacity:1}}
          transition={{type:"spring", stiffness:200, damping:15}}
          className={`text-[100px] leading-none rounded-[40px] bg-gradient-to-br ${areaInfo.color} p-6 shadow-2xl`}>
          {q.key}
        </motion.div>
      </div>

      {/* 문제 */}
      <motion.div key={"q"+idx}
        initial={{y:20, opacity:0}} animate={{y:0, opacity:1}}
        className="bg-white/90 rounded-3xl shadow-xl p-5 mb-4 backdrop-blur">
        <p className="font-cafe24 text-3xl text-center text-gray-800 leading-tight">
          {q.q.split("").map((ch,i)=>(
            <span key={i} className="pop-letter" style={{animationDelay:`${i*0.03}s`}}>{ch}</span>
          ))}
        </p>
      </motion.div>

      {/* 보기 */}
      <div className="grid grid-cols-1 gap-3 max-w-2xl mx-auto">
        {q.opts.map((opt, i)=> {
          const isPicked = picked === i;
          const isAns = i === q.ans;
          let cls = "bg-white hover:bg-yellow-50";
          if (revealed && isAns) cls = "bg-emerald-400 text-white";
          else if (revealed && isPicked && !isAns) cls = "bg-rose-400 text-white shake";
          return (
            <motion.button key={i}
              whileHover={{ scale: revealed?1:1.02 }} whileTap={{ scale: 0.98 }}
              onClick={(e)=>choose(i, e)} disabled={revealed}
              className={`${cls} rounded-2xl p-4 shadow-md flex items-center gap-4 font-cafe24 text-2xl text-left card-hover`}>
              <div className="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-200 to-pink-200 flex items-center justify-center text-xl">
                {["①","②","③"][i]}
              </div>
              <span className="flex-1">{opt}</span>
              {revealed && isAns && <Check size={28}/>}
              {revealed && isPicked && !isAns && <X size={28}/>}
            </motion.button>
          );
        })}
      </div>

      {/* 하단 버튼 */}
      <div className="absolute bottom-6 left-6 right-6 flex justify-between items-center gap-3">
        <button onClick={askHelp}
          className="px-5 py-3 rounded-2xl bg-purple-200 text-purple-700 font-cafe24 text-xl shadow card-hover flex items-center gap-2">
          <HelpCircle size={22}/> 💜 도움받기
        </button>
        {revealed && (
          <motion.button initial={{scale:0}} animate={{scale:1}}
            onClick={next}
            className="px-8 py-3 rounded-2xl bg-gradient-to-r from-emerald-400 to-green-500 text-white font-cafe24 text-2xl shadow-lg card-hover">
            {idx+1 >= pool.length ? "끝내기 🎉" : "다음 →"}
          </motion.button>
        )}
      </div>

      {bursts.map(b=> <Burst key={b.id} x={b.x} y={b.y} onDone={()=>setBursts(bs=>bs.filter(x=>x.id!==b.id))}/>)}

      <AnimatePresence>
        {showHelp && (
          <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}}
            className="fixed inset-0 bg-black/30 flex items-center justify-center z-50 p-6"
            onClick={()=>setShowHelp(false)}>
            <motion.div initial={{scale:0.7}} animate={{scale:1}}
              className="bg-white rounded-3xl p-8 max-w-md shadow-2xl text-center">
              <div className="text-6xl mb-3 bounce-soft">💜</div>
              <p className="font-cafe24 text-2xl text-gray-800 mb-4">{q.tip}</p>
              <button onClick={()=>setShowHelp(false)}
                className="px-6 py-3 bg-purple-400 text-white rounded-2xl font-cafe24 text-xl">알겠어요!</button>
            </motion.div>
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

    }
  }, [allDone]);

  const handleDrop = (card, side, point) => {
    if (side === card.correct) {
      setPlaced(p => ({...p, [card.id]: side}));
      popSound();
      const id = Date.now() + Math.random();
      setBursts(b => [...b, {id, x: point.x, y: point.y}]);

function RecordReflect({ name, speakerOn, micOn, score, total, onDone }) {
  const [recording, setRecording] = useState(false);
  const [audioURL, setAudioURL] = useState(null);
  const [stt, setStt] = useState("");
  const [textInput, setTextInput] = useState("");
  const [stars, setStars] = useState(0);
  const [stickerPicked, setStickerPicked] = useState(null);
  const recRef = useRef(null);
  const chunksRef = useRef([]);
  const recogRef = useRef(null);

  const prompt = "오늘 가장 기억에 남는 안전 규칙 한 가지를 말해 봐요.";
  useEffect(()=>{ speak(prompt, speakerOn); },[]);

  const startRec = async () => {
    setStt(""); setAudioURL(null); chunksRef.current = [];
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mr = new MediaRecorder(stream);
      recRef.current = mr;
      mr.ondataavailable = e => chunksRef.current.push(e.data);
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, {type:"audio/webm"});
        setAudioURL(URL.createObjectURL(blob));
        stream.getTracks().forEach(t=>t.stop());
      };
      mr.start();
      setRecording(true);
      // STT
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        const r = new SR();
        r.lang = "ko-KR"; r.continuous = true; r.interimResults = true;
        r.onresult = (ev) => {
          let s = "";
          for (let i=ev.resultIndex; i<ev.results.length; i++) s += ev.results[i][0].transcript;
          setStt(s);
        };
        r.start();
        recogRef.current = r;
      }
    } catch(e) {
      alert("마이크를 사용할 수 없어요. 글로 적어 주세요.");
    }
  };
  const stopRec = () => {
    recRef.current?.stop();
    recogRef.current?.stop();
    setRecording(false);
  };

  const finalText = (stt || textInput).trim();
  const canFinish = stars >= 4 || (stars >=1 && audioURL && stars >= 4);
  const needRetry = stars >= 1 && stars <= 3;

  const finish = () => {
    if (!stars) return;
    if (needRetry) {
      // 다시
      setStars(0); setAudioURL(null); setStt(""); setTextInput("");
      return;
    }
    saveToGAS("reflection", {
      name, text: finalText, stars, sticker: stickerPicked,
      score, total, time: new Date().toISOString()
    });
    onDone({ stars, text: finalText, sticker: stickerPicked });
  };

  return (
    <div className="absolute inset-0 pt-20 px-6 pb-6 overflow-auto no-scrollbar">
      <FloatingDeco/>
      <div className="max-w-2xl mx-auto">
        <h2 className="font-cafe24 text-3xl text-center mb-2">
          🎤 <span className="hi-blue">내 생각 말하기</span>
        </h2>
        <p className="font-cafe24 text-xl text-center text-gray-600 mb-5">{prompt}</p>

        <div className="bg-white/90 rounded-3xl p-6 shadow-xl mb-4">
          <div className="flex justify-center mb-4">
            {!recording ? (
              <button onClick={startRec}
                className="w-24 h-24 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 text-white shadow-2xl flex items-center justify-center card-hover">
                <Mic size={40}/>
              </button>
            ) : (
              <button onClick={stopRec}
                className="w-24 h-24 rounded-full bg-rose-500 text-white shadow-2xl flex items-center justify-center recording-pulse">
                <Square size={32}/>
              </button>
            )}
          </div>
          <p className="text-center font-cafe24 text-lg text-gray-500">
            {recording ? "🎙️ 듣고 있어요…" : audioURL ? "✅ 녹음 완료!" : "마이크를 눌러서 말해 봐요"}
          </p>

          {(stt || textInput || audioURL) && (
            <div className="mt-4">
              <div className="font-cafe24 text-base text-gray-500 mb-1">📝 내가 말한 내용</div>
              <textarea value={stt || textInput} onChange={e=>setTextInput(e.target.value)} rows={2}
                placeholder="여기에 직접 적어도 돼요!"
                className="w-full p-3 rounded-2xl border-4 border-yellow-100 font-cafe24 text-lg"/>
            </div>
          )}

          {audioURL && (
            <div className="mt-3 flex gap-2">
              <audio src={audioURL} controls className="w-full"/>
              <button onClick={()=>{ setAudioURL(null); setStt(""); }} className="p-3 bg-gray-100 rounded-2xl card-hover">
                <Trash2 size={20}/>
              </button>
            </div>
          )}
        </div>

        {/* 별점 */}
        <div className="bg-white/90 rounded-3xl p-6 shadow-xl mb-4">
          <p className="font-cafe24 text-xl text-center text-gray-700 mb-3">
            내 녹음을 들어보고 ⭐ 점수를 줘요
          </p>
          <div className="flex justify-center gap-2">
            {[1,2,3,4,5].map(n=>(
              <button key={n} onClick={()=>{ setStars(n); popSound(); }}
                className="star-btn">
                <Star size={48} fill={n<=stars?"#FBBF24":"none"} stroke={n<=stars?"#F59E0B":"#D1D5DB"} strokeWidth={2}/>
              </button>
            ))}
          </div>
          {stars > 0 && stars <= 3 && (
            <p className="text-center mt-3 font-cafe24 text-lg text-rose-500">
              💪 한 번 더 녹음해 볼까요? 더 멋지게 할 수 있어요!
            </p>
          )}
          {stars >= 4 && (
            <div className="mt-4">
              <p className="text-center font-cafe24 text-lg text-emerald-600 mb-2">
                와! 정말 잘했어요. 스티커를 골라 주세요! 🎁
              </p>
              <div className="flex justify-center flex-wrap gap-2">
                {STICKERS.map(s=>(
                  <button key={s} onClick={()=>{ setStickerPicked(s); popSound(); }}
                    className={`text-4xl p-2 rounded-2xl card-hover ${stickerPicked===s?"bg-yellow-200 scale-110":"bg-white"}`}>
                    {s}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="flex justify-center">
          <button onClick={finish} disabled={!stars || (stars>=4 && !stickerPicked)}
            className="px-8 py-4 rounded-2xl bg-gradient-to-r from-emerald-400 to-green-500 text-white font-cafe24 text-2xl shadow-lg card-hover disabled:opacity-40 disabled:cursor-not-allowed">
            {needRetry ? "다시 녹음하기 🔄" : "다음으로 🚀"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   수료증
========================================================= */
function Certificate({ name, area, score, total, stars, sticker, helpUsed, onHome }) {
  const areaInfo = AREAS.find(a=>a.id===area) || AREAS[0];
  useEffect(()=>{
    speak(`${name} 친구, 안전탐험을 모두 마쳤어요! 정말 멋져요!`, true, {force:true});
    // 폭죽 사운드
    happySound();
    setTimeout(happySound, 400);
    setTimeout(happySound, 900);
  },[]);
  const today = new Date();
  const dateStr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;
  return (
    <div className="absolute inset-0 pt-20 px-6 pb-6 overflow-auto no-scrollbar">
      <FloatingDeco/>
      <motion.div initial={{scale:0.7, opacity:0, y:30}} animate={{scale:1, opacity:1, y:0}}
        transition={{type:"spring", stiffness:120}}
        className="max-w-2xl mx-auto bg-white rounded-[40px] shadow-2xl p-8 border-8 border-double border-yellow-300 relative">
        <div className="absolute -top-6 left-1/2 -translate-x-1/2 bg-gradient-to-r from-yellow-300 to-pink-300 rounded-full px-6 py-2 shadow-lg">
          <span className="font-cafe24 text-2xl">🏆 안전탐험 수료증 🏆</span>
        </div>

        <div className="text-center mt-6">
          <div className="text-7xl mb-3 bounce-soft">{sticker || "🎉"}</div>
          <p className="font-cafe24 text-3xl mb-2">
            <span className="hi-yellow">{name}</span> 친구
          </p>
          <p className="font-cafe24 text-xl text-gray-600 mb-5">위 어린이는</p>
          <div className={`inline-block px-5 py-2 rounded-full text-white font-cafe24 text-xl bg-gradient-to-r ${areaInfo.color} mb-4 shadow`}>
            {areaInfo.emoji} {areaInfo.name}
          </div>
          <p className="font-cafe24 text-2xl text-gray-700 leading-relaxed mb-5">
            안전탐험을 끝까지 잘 마쳤음을 칭찬합니다!
          </p>

          <div className="grid grid-cols-3 gap-2 max-w-md mx-auto mb-6">
            <div className="bg-rose-50 rounded-2xl p-3">
              <div className="text-3xl mb-1">📝</div>
              <div className="font-cafe24 text-base text-gray-500">맞춘 문제</div>
              <div className="font-cafe24 text-2xl text-rose-500">{score}/{total}</div>
            </div>
            <div className="bg-yellow-50 rounded-2xl p-3">
              <div className="text-3xl mb-1">⭐</div>
              <div className="font-cafe24 text-base text-gray-500">자기 별점</div>
              <div className="font-cafe24 text-2xl text-amber-500">{stars}/5</div>
            </div>
            <div className="bg-purple-50 rounded-2xl p-3">
              <div className="text-3xl mb-1">💜</div>
              <div className="font-cafe24 text-base text-gray-500">도움 횟수</div>
              <div className="font-cafe24 text-2xl text-purple-500">{helpUsed}</div>
            </div>
          </div>

          <p className="font-cafe24 text-lg text-gray-500">{dateStr}</p>
          <p className="font-cafe24 text-lg text-gray-500">안전탐험 🛡️</p>
        </div>
      </motion.div>

      <div className="text-center mt-6">
        <button onClick={onHome}
          className="px-8 py-3 rounded-2xl bg-gradient-to-r from-pink-400 to-rose-500 text-white font-cafe24 text-2xl shadow-lg card-hover">
          🏠 처음으로
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   메인 App
========================================================= */
function App() {
  const [step, setStep] = useState("start"); // start, area, quiz, reflect, cert
  const [name, setName] = useState("");
  const [area, setArea] = useState("");
  const [speakerOn, setSpeakerOn] = useState(false);
  const [micOn, setMicOn] = useState(true);
  const [showTutorial, setShowTutorial] = useState(false);
  const [quizResult, setQuizResult] = useState({score:0, total:0});
  const [reflectResult, setReflectResult] = useState({stars:0, sticker:null});
  const [helpUsed, setHelpUsed] = useState(0);

  // 마이크 권한 한 번만
  useEffect(()=>{
    const asked = localStorage.getItem("mic_asked");
    if (!asked && navigator.mediaDevices) {
      navigator.mediaDevices.getUserMedia({audio:true})
        .then(s=> { s.getTracks().forEach(t=>t.stop()); localStorage.setItem("mic_asked","1"); })
        .catch(()=> localStorage.setItem("mic_asked","1"));
    }
    // TTS 음성 로딩 트리거
    window.speechSynthesis?.getVoices();
    window.speechSynthesis?.addEventListener?.("voiceschanged", ()=>{});
  },[]);

  const reset = () => {
    setStep("start"); setName(""); setArea("");
    setQuizResult({score:0,total:0}); setReflectResult({stars:0, sticker:null});
    setHelpUsed(0);
  };

  const progress =
    step === "start" ? 0 :
    step === "area" ? 0.1 :
    step === "concept" ? 0.3 :
    step === "quiz" ? 0.6 :
    step === "reflect" ? 0.85 :
    step === "cert" ? 1 : 0;

  return (
    <div className="relative w-full h-full">
      {step !== "start" && (
        <TopBar name={name} speakerOn={speakerOn} setSpeakerOn={setSpeakerOn}
          micOn={micOn} setMicOn={setMicOn} onHome={reset} progress={progress}/>
      )}

      <AnimatePresence mode="wait">
        {step === "start" && (
          <motion.div key="start" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="absolute inset-0">
            <StartScreen
              onStart={(n)=>{ setName(n); setStep("area"); }}
              onShowTutorial={()=>setShowTutorial(true)}
            />
          </motion.div>
        )}
        {step === "area" && (
          <motion.div key="area" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="absolute inset-0">
            <AreaSelect name={name} speakerOn={speakerOn}
              onPick={(a)=>{ setArea(a); setStep("concept"); }}/>
          </motion.div>
        )}
        {step === "concept" && (
          <motion.div key="concept" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="absolute inset-0">
            <ConceptLearn area={area} speakerOn={speakerOn}
              onDone={()=> setStep("quiz")}/>
          </motion.div>
        )}
        {step === "quiz" && (
          <motion.div key="quiz" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="absolute inset-0">
            <Quiz area={area} name={name} speakerOn={speakerOn} micOn={micOn}
              helpUsed={helpUsed} setHelpUsed={setHelpUsed}
              onDone={(r)=>{ setQuizResult(r); setStep("reflect"); }}/>
          </motion.div>
        )}
        {step === "reflect" && (
          <motion.div key="reflect" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="absolute inset-0">
            <RecordReflect name={name} speakerOn={speakerOn} micOn={micOn}
              score={quizResult.score} total={quizResult.total}
              onDone={(r)=>{ setReflectResult(r); setStep("cert"); }}/>
          </motion.div>
        )}
        {step === "cert" && (
          <motion.div key="cert" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="absolute inset-0">
            <Certificate name={name} area={area}
              score={quizResult.score} total={quizResult.total}
              stars={reflectResult.stars} sticker={reflectResult.sticker}
              helpUsed={helpUsed}
              onHome={reset}/>
          </motion.div>
        )}
      </AnimatePresence>

      <AnimatePresence>
        {showTutorial && <Tutorial speakerOn={speakerOn} onClose={()=>setShowTutorial(false)}/>}
      </AnimatePresence>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
